name: build-deploy-release
on:
  release:
    types: [published]
jobs:
  deploy-images:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      USERNAME: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest tag variable
        run: echo "CONTAINER=${{ env.REGISTRY }}/${{ env.USERNAME }}/geocoder_pcgc:latest" >> $GITHUB_ENV

      - name: Extract release tag
        if: github.event_name == 'release'
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        
      - name: Create release tag variable
        if: github.event_name == 'release'
        run: echo "VERSIONED=${{ env.REGISTRY }}/${{ env.USERNAME }}/geocoder_pcgc:${{ env.RELEASE_TAG }}" >> $GITHUB_ENV

      - name: Build container
        run: |
              docker build --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) \
              --build-arg GIT_DATE="$(git log -1 --format=%cd --date=iso-strict)" \
              --build-arg IMAGE_TAG=${{github.ref_name}} \
              -t ${{ env.CONTAINER }} .

      - name: Tag and push release (and latest) container
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            docker tag ${{ env.CONTAINER }} ${{ env.VERSIONED }}
            docker push ${{ env.VERSIONED }}
          fi
          docker push ${{ env.CONTAINER }}
          
      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          
      - name: Update README
        run: sed -i "s|ghcr\.io/pcgcid/geocoder_pcgc:[^ ]*|ghcr.io/pcgcid/geocoder_pcgc:${RELEASE_TAG}|g" README.md

      - name: Update Rmd documentation
        run: sed -i "s|ghcr\.io/pcgcid/geocoder_pcgc:[^ ]*|ghcr.io/pcgcid/geocoder_pcgc:${RELEASE_TAG}|g" docs/doc.Rmd

      - name: Commit and push changes
        run: |
          git fetch origin main
          git checkout main
          git add README.md
          git add docs/doc*
          git commit -m "Update README and Rmd documentation with version ${RELEASE_TAG}"
          git push origin main
